<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6C5CE7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ca Karo">
<title>Ca Karo — CA Inter Study Tracker</title>
<style>
:root{
  --violet:#6C5CE7;
  --violet-deep:#5A46D6;
  --violet-soft:#EFEBFF;
  --coral:#FF7A59;
  --mint:#00C2A8;
  --amber:#FFB020;
  --ink:#231F3D;
  --sub:#6E6A8A;
  --bg:#F6F4FF;
  --card:#FFFFFF;
  --line:#E9E5FA;
  --shadow: 0 8px 24px rgba(108,92,231,0.08), 0 2px 6px rgba(35,31,61,0.04);
  --radius:20px;
  --AA:#8B7CF6; --LAW:#3DCB7A; --IT:#FB923C; --GST:#22B8CF; --CMA:#F26FA0; --AUD:#F2B807; --FM:#4E9BFA; --SM:#C264E8;
}
[data-theme="dark"]{
  --ink:#F1EEFF;
  --sub:#B3ADD6;
  --bg:#15122A;
  --card:#1E1A3B;
  --line:#2C2652;
  --violet-soft:#26205A;
  --shadow: 0 8px 24px rgba(0,0,0,0.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'DM Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--ink);
  transition:background .25s,color .25s;
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,.display{
  font-family:'Fredoka','Poppins',system-ui,sans-serif;
  font-weight:600;
  letter-spacing:-0.01em;
}
a{color:inherit;}
button,input,select,textarea{font-family:inherit;color:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}

/* ---------- LAYOUT ---------- */
#app{display:flex;min-height:100vh;}
.sidebar{
  width:220px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);
  padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 22px;}
.brand .logo{width:34px;height:34px;object-fit:contain;display:block;background:#fff;border-radius:9px;padding:4px;box-shadow:var(--shadow);}
.brand span{font-family:'Fredoka',sans-serif;font-weight:700;font-size:19px;}
.navlink{
  display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;cursor:pointer;
  color:var(--sub);font-size:14.5px;font-weight:600;transition:all .15s;border:none;background:transparent;text-align:left;width:100%;
}
.navlink:hover{background:var(--violet-soft);color:var(--ink);}
.navlink.active{background:var(--violet);color:#fff;box-shadow:var(--shadow);}
.navlink .ic{font-size:17px;width:20px;text-align:center;}
.nav-divider{height:1px;background:var(--line);margin:10px 6px;}
.sidebar-foot{margin-top:auto;padding:10px;}
.streak-pill{background:var(--violet-soft);border-radius:14px;padding:10px 12px;font-size:12.5px;color:var(--sub);display:flex;align-items:center;gap:8px;}

main{flex:1;min-width:0;padding:26px 32px 100px;max-width:1180px;}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;margin-bottom:22px;}
.greet h1{font-size:26px;margin:0 0 4px;}
.greet p{margin:0;color:var(--sub);font-size:14px;}
.btn{
  border:none;border-radius:14px;padding:11px 18px;font-weight:700;font-size:14px;cursor:pointer;
  background:var(--violet);color:#fff;transition:transform .1s, box-shadow .15s;box-shadow:var(--shadow);
}
.btn:hover{transform:translateY(-1px);}
.btn.ghost{background:var(--violet-soft);color:var(--violet-deep);box-shadow:none;}
.btn.warn{background:#FFEAEA;color:#D64545;box-shadow:none;}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:10px;}
.btn.outline{background:transparent;border:1.5px solid var(--line);color:var(--ink);box-shadow:none;}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}

.grid{display:grid;gap:16px;}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1000px){.grid.cols-4{grid-template-columns:repeat(2,1fr);}.grid.cols-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr;}}

.card{
  background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border:1px solid var(--line);
}
.card.tint-violet{background:linear-gradient(135deg,var(--violet),var(--violet-deep));color:#fff;border:none;}
.card.tint-coral{background:linear-gradient(135deg,#FF9472,var(--coral));color:#fff;border:none;}
.card.tint-mint{background:linear-gradient(135deg,#39E0C4,var(--mint));color:#fff;border:none;}
.card.tint-amber{background:linear-gradient(135deg,#FFCF6B,var(--amber));color:#231F3D;border:none;}
.stat-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;opacity:.85;font-weight:700;margin-bottom:10px;}
.stat-num{font-size:34px;font-weight:700;font-family:'Fredoka',sans-serif;line-height:1;}
.stat-num small{font-size:16px;font-weight:600;}
.stat-sub{font-size:12.5px;opacity:.8;margin-top:8px;}

.section-title{font-size:17px;margin:28px 0 12px;display:flex;align-items:center;justify-content:space-between;}
.section-title .hint{font-size:12.5px;color:var(--sub);font-weight:500;}

.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:13px;font-weight:600;cursor:pointer;color:var(--sub);}
.chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.chip .dot{width:8px;height:8px;border-radius:50%;}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;}

.progress-track{background:var(--violet-soft);border-radius:999px;height:9px;overflow:hidden;flex:1;}
.progress-fill{height:100%;border-radius:999px;background:var(--violet);transition:width .3s;}
.subject-row{display:flex;align-items:center;gap:12px;padding:10px 0;}
.subject-row .sname{width:110px;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.subject-row .swatch{width:9px;height:9px;border-radius:50%;}
.subject-row .spct{width:44px;text-align:right;font-size:12.5px;color:var(--sub);font-weight:700;}

.list-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);}
.list-row:last-child{border-bottom:none;}
.empty{text-align:center;padding:50px 20px;color:var(--sub);}
.empty h3{color:var(--ink);margin-bottom:6px;}
.empty .big{font-size:38px;margin-bottom:10px;}

label.field-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--sub);display:block;margin-bottom:6px;}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:14px;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--violet);}
.topic-textarea{resize:none;overflow:hidden;min-height:44px;line-height:1.5;font-family:inherit;white-space:pre-wrap;word-break:break-word;}
.field{margin-bottom:14px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:520px){.two-col{grid-template-columns:1fr;}}

.tabbar-mobile{display:none;}
.mood-btn{font-size:24px;background:none;border:2px solid var(--line);border-radius:12px;padding:5px 9px;cursor:pointer;line-height:1;transition:all .15s;}
.mood-btn.active{border-color:var(--violet);background:var(--violet-soft);}
.stars{display:inline-flex;gap:2px;cursor:pointer;}
.star{font-size:15px;color:var(--line);}
.star.on{color:var(--amber);}

.modal-backdrop{position:fixed;inset:0;background:rgba(20,15,45,.45);display:flex;align-items:flex-end;justify-content:center;z-index:200;backdrop-filter:blur(2px);}
.modal{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:24px;max-height:88vh;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.2);}
@media(min-width:760px){
  .modal-backdrop{align-items:center;}
  .modal{border-radius:24px;}
}
.modal h2{margin-top:0;}
.close-x{float:right;cursor:pointer;font-size:20px;color:var(--sub);background:none;border:none;}

.lock-screen{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;align-items:center;justify-content:center;padding:24px;}
.lock-card{width:100%;max-width:340px;text-align:center;}
.lock-logo{width:64px;height:64px;background:#fff;border-radius:16px;padding:10px;box-shadow:var(--shadow);margin:0 auto 22px;display:flex;align-items:center;justify-content:center;}
.lock-logo img{width:100%;height:100%;object-fit:contain;display:block;}
.pin-dots{display:flex;gap:12px;justify-content:center;margin:18px 0;}
.pin-dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line);background:transparent;}
.pin-dot.filled{background:var(--violet);border-color:var(--violet);}

.timer-num{font-family:'Fredoka',sans-serif;font-size:64px;font-weight:700;text-align:center;color:var(--violet);letter-spacing:1px;}
.timer-card{position:relative;}
.timer-topic-row{margin:14px auto 0;max-width:340px;background:var(--violet-soft);color:var(--violet-deep);font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:10px;cursor:pointer;}
.timer-extra-row{display:flex;justify-content:center;margin-top:12px;}
.timer-footer-row{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap;}
:fullscreen .timer-card{max-width:100%;height:100vh;display:flex;flex-direction:column;justify-content:center;border-radius:0;}
:fullscreen .timer-num{font-size:96px;}
.heatmap{display:grid;grid-template-columns:repeat(auto-fill,12px);grid-auto-flow:column;gap:3px;overflow-x:auto;padding-bottom:6px;}
.hcell{width:12px;height:12px;border-radius:3px;background:var(--violet-soft);}
.badge{display:inline-block;padding:3px 9px;border-radius:8px;font-size:11px;font-weight:700;background:var(--violet-soft);color:var(--violet-deep);}
.strategy-item{display:flex;gap:14px;padding:16px;border-radius:16px;background:var(--violet-soft);margin-bottom:10px;}
.strategy-item .num{font-family:'Fredoka',sans-serif;font-weight:700;font-size:20px;color:var(--violet);flex-shrink:0;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:14px;font-size:13.5px;font-weight:600;z-index:400;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s, bottom .25s;}
.toast.show{opacity:1;bottom:34px;}

@media(max-width:900px){
  .sidebar{display:none;}
  main{padding:18px 16px 100px;}
  .tabbar-mobile{
    display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);
    justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:100;
  }
  .tabbar-mobile button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--sub);font-weight:700;padding:4px 8px;flex:1;}
  .tabbar-mobile button.active{color:var(--violet);}
  .tabbar-mobile .ic{font-size:19px;}
}
.more-sheet-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.more-sheet-grid .navlink{background:var(--violet-soft);border-radius:14px;justify-content:flex-start;}
.more-sheet-label{font-size:10.5px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;margin:14px 2px 8px;}
.more-sheet-label:first-of-type{margin-top:4px;}
.nav-group-label{font-size:10px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;margin:14px 14px 4px;}

/* ---------- COMPACT TOP HEADER BAR (Ca Karo) ---------- */
.topheader{
  background:linear-gradient(120deg,var(--violet) 0%,var(--violet-deep) 75%);
  color:#fff;padding:calc(10px + env(safe-area-inset-top)) 18px 10px;position:relative;z-index:90;box-shadow:0 4px 14px rgba(90,70,220,.22);
}
.th-compact{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.th-brand{display:flex;align-items:center;gap:8px;cursor:pointer;}
.th-logo{font-size:18px;line-height:1;}
.th-name{font-family:'Fredoka',sans-serif;font-size:16px;font-weight:700;}
.th-group-badge{font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700;background:#ffffff26;border:1px solid #ffffff3a;color:#fff;border-radius:999px;padding:2px 9px;}
.th-quickstats{display:flex;align-items:center;gap:8px;}
.th-qs{font-size:11.5px;font-weight:700;color:#fff;background:#ffffff1c;border:none;border-radius:999px;padding:4px 10px;white-space:nowrap;}
.th-setdate{cursor:pointer;color:#fff;}
.th-warn{font-size:13px;}
.th-gear{background:#ffffff1c;border:none;color:#fff;border-radius:999px;width:26px;height:26px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.th-gear:hover{background:#ffffff30;}

/* ---------- PRIORITY BADGES & TICK-MARK CHAPTER TRACKER ---------- */
.pri-badge{display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;cursor:pointer;border:none;flex-shrink:0;letter-spacing:.02em;}
.pri-badge.A{background:#FDECEA;color:#B23A3A;}
.pri-badge.B{background:#E7F8EF;color:#1A8F5A;}
.pri-badge.C{background:#E8F1FD;color:#2A5FA8;}
[data-theme="dark"] .pri-badge.A{background:#3A1E1E;color:#F58B8B;}
[data-theme="dark"] .pri-badge.B{background:#173626;color:#7CDDAA;}
[data-theme="dark"] .pri-badge.C{background:#152A44;color:#8FB8EE;}
.pri-legend{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-size:12px;color:var(--sub);font-weight:600;}
.group-banner{background:var(--violet-soft);color:var(--violet-deep);font-size:12.5px;font-weight:600;padding:9px 14px;border-radius:12px;margin-bottom:14px;}
.syl-search-wrap{display:flex;gap:8px;margin-bottom:14px;}
.syl-search{flex:1;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13.5px;font-family:inherit;}
.syl-search:focus{outline:none;border-color:var(--violet);}
.paper-bulk-btn{background:none;border:none;color:var(--sub);font-size:16px;font-weight:800;cursor:pointer;padding:2px 8px;flex-shrink:0;}
.paper-bulk-btn:hover{color:var(--violet-deep);}
.quote-card{background:linear-gradient(120deg,#241C4A,#3a2d70);color:#EDE8FF;font-size:13px;font-style:italic;line-height:1.6;padding:14px 18px;border-radius:14px;margin-bottom:16px;font-weight:500;}

/* ---------- ACTIVITY PICKER (Session) — each activity gets its own color identity ---------- */
.activity-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;}
.activity-card{
  background:var(--card);border:1.5px solid var(--line);border-radius:18px;
  padding:26px 16px 22px;text-align:center;cursor:pointer;
  transition:transform .12s, box-shadow .12s, border-color .12s;
  position:relative;overflow:hidden;
}
.activity-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:56px;
  background:var(--act-soft);opacity:.7;z-index:0;
}
.activity-card:hover{transform:translateY(-2px);border-color:var(--act-color);box-shadow:0 8px 20px -8px var(--act-color);}
.activity-card:active{transform:translateY(0);}
.activity-icon-ring{
  position:relative;z-index:1;width:56px;height:56px;margin:0 auto 12px;border-radius:16px;
  background:var(--act-soft);border:1.5px solid var(--act-color);
  display:flex;align-items:center;justify-content:center;font-size:26px;
}
.activity-card h3{position:relative;z-index:1;margin:0 0 4px;font-size:15px;font-weight:700;color:var(--act-color);}
.activity-card p{position:relative;z-index:1;color:var(--sub);font-size:12px;margin:0;line-height:1.4;}
[data-theme="dark"] .activity-card::before{opacity:.16;}
[data-theme="dark"] .activity-icon-ring{opacity:.95;}
.weekly-review-card{background:linear-gradient(120deg,#241C4A,#3a2d70);color:#fff;border-radius:16px;padding:16px 18px;margin-bottom:16px;}
.wr-hd{font-size:13px;font-weight:700;margin-bottom:12px;}
.wr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;}
.wr-num{font-family:'Fredoka',sans-serif;font-size:20px;font-weight:700;}
.wr-label{font-size:10px;color:#C9C0FF;margin-top:2px;line-height:1.4;}
.wr-insight{font-size:12px;color:#EDE8FF;line-height:1.6;background:#ffffff14;border-radius:10px;padding:9px 12px;}
.wr-priorities{background:#ffffff10;border-radius:10px;padding:10px 12px;margin-bottom:10px;}
.wr-priorities-hd{font-size:9.5px;font-weight:800;letter-spacing:.07em;color:#C9C0FF;margin-bottom:7px;}
.wr-pr-row{display:flex;align-items:center;gap:8px;font-size:12px;color:#EDE8FF;padding:4px 0;}
.wr-pr-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.wr-pr-count{margin-left:auto;font-size:10.5px;color:#B9A9FF;}
.weak-topic-row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);}
.weak-topic-row:last-child{border-bottom:none;}
.weak-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.exam-board-banner{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(120deg,var(--violet),var(--violet-deep));color:#fff;border-radius:14px;padding:14px 18px;margin-bottom:16px;}
.eb-label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;opacity:.85;}
.eb-date{font-family:'Fredoka',sans-serif;font-size:16px;font-weight:700;margin-top:2px;}
.eb-days{text-align:right;}
.eb-days-num{font-family:'Fredoka',sans-serif;font-size:24px;font-weight:700;line-height:1;}
.eb-days-label{font-size:9.5px;text-transform:uppercase;opacity:.85;font-weight:700;}
.pri-filterrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.syl-stat-row{display:flex;gap:8px;margin-bottom:12px;}
.syl-stat{flex:1;min-width:0;background:var(--card);border-radius:14px;padding:10px 8px;border:1px solid var(--line);text-align:center;}
.syl-stat .lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--sub);font-weight:700;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.syl-stat .val{font-size:19px;font-weight:700;font-family:'Fredoka',sans-serif;line-height:1;}
@media(max-width:380px){.syl-stat .val{font-size:16px;} .syl-stat{padding:8px 5px;}}
.pri-filter{padding:6px 15px;border-radius:999px;border:none;font-size:12.5px;cursor:pointer;font-weight:700;background:var(--violet-soft);color:var(--sub);}
.pri-filter.on{color:#fff;}
.pri-filter.on.ALL{background:var(--ink);}
.pri-filter.on.A{background:#D64545;}
.pri-filter.on.B{background:#1A8F5A;}
.pri-filter.on.C{background:#2A5FA8;}

.paper-card{background:var(--card);border-radius:16px;margin-bottom:10px;overflow:hidden;border:1px solid var(--line);}
.paper-hd{display:flex;gap:11px;align-items:center;padding:13px 15px;cursor:pointer;}
.paper-badge{width:32px;height:32px;border-radius:9px;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.paper-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.paper-meta{display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap;}
.paper-prog-text{font-size:13.5px;font-weight:800;}
.paper-prog-bar{height:4px;background:var(--violet-soft);}
.paper-prog-fill{height:100%;transition:width .3s;}
.chapter-list{padding:4px 10px 10px;}
.chv{font-size:11px;color:var(--sub);flex-shrink:0;}
.sess-edit-btn{background:none;border:none;font-size:14px;cursor:pointer;opacity:.55;flex-shrink:0;padding:4px;}
.sess-edit-btn:hover{opacity:1;}

/* stage-tracker chapter row */
.ch-item-v2{padding:11px 6px;border-bottom:1px solid var(--line);}
.ch-item-v2:last-child{border-bottom:none;}
.ch-item-top{display:flex;gap:9px;align-items:center;}
.ch-num{font-size:11px;color:var(--sub);width:16px;flex-shrink:0;font-weight:700;}
.ch-name-v2{flex:1;font-size:13px;font-weight:600;min-width:0;}
.ch-name-v2.done{text-decoration:line-through;color:var(--sub);}
.ch-ring{flex-shrink:0;font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;cursor:pointer;background:var(--violet-soft);color:var(--violet-deep);border:none;}
.ch-ring.full{background:var(--mint);color:#fff;}
.ch-stage-row{display:flex;align-items:center;gap:6px;margin-top:8px;margin-left:25px;flex-wrap:wrap;}
.stage-dot{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;flex-shrink:0;opacity:.45;filter:saturate(.3);transition:all .15s;}
.stage-dot.on{opacity:1;filter:none;background:var(--violet-soft);border-color:var(--violet);}
[data-theme="dark"] .stage-dot{background:#241f47;border-color:#3a3468;}
.stage-label{font-size:9px;color:var(--sub);}
.ch-notes-btn{font-size:10.5px;color:var(--violet-deep);background:var(--violet-soft);border:none;border-radius:7px;padding:5px 9px;cursor:pointer;flex-shrink:0;margin-left:auto;}
.ch-star-row{display:flex;align-items:center;gap:3px;margin-top:7px;margin-left:25px;flex-wrap:wrap;}
.star-count-label{font-size:9.5px;color:var(--sub);font-weight:700;background:var(--violet-soft);border-radius:6px;padding:2px 6px;cursor:pointer;margin-right:4px;flex-shrink:0;}
.lecture-star{background:none;border:none;font-size:15px;cursor:pointer;padding:1px;opacity:.35;filter:grayscale(1);transition:all .12s;flex-shrink:0;line-height:1;}
.lecture-star.on{opacity:1;filter:none;transform:scale(1.05);}
.lecture-star.super{font-size:17px;}

/* theme-aware status/impact chips (used from JS via class name, not inline hex) */
.status-chip{font-size:10px;font-weight:800;padding:2px 9px;border-radius:999px;flex-shrink:0;}
.status-chip.done{background:#DFF7EC;color:#1D9C63;}
.status-chip.in-progress{background:#FFF3D6;color:#9C6B00;}
.status-chip.pending{background:#FFEAEA;color:#D64545;}
[data-theme="dark"] .status-chip.done{background:#173626;color:#7CDDAA;}
[data-theme="dark"] .status-chip.in-progress{background:#3A2E0E;color:#F0C868;}
[data-theme="dark"] .status-chip.pending{background:#3A1E1E;color:#F58B8B;}
.impact-chip{font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:999px;flex-shrink:0;}
.impact-chip.HIGH{background:#FFEAEA;color:#D64545;}
.impact-chip.MED{background:#FFF3D6;color:#9C6B00;}
[data-theme="dark"] .impact-chip.HIGH{background:#3A1E1E;color:#F58B8B;}
[data-theme="dark"] .impact-chip.MED{background:#3A2E0E;color:#F0C868;}

/* ---------- AIR STRATEGY ---------- */
.air-hero{border-radius:16px;padding:16px 18px;margin-bottom:14px;color:#fff;}
.air-hero.red{background:linear-gradient(135deg,#3A1414,#2A0E0E);border-left:4px solid #E14F4F;}
.air-hero.blue{background:linear-gradient(135deg,#131C33,#0D1424);border-left:4px solid #5A9DE8;}
.air-hero.green{background:linear-gradient(135deg,#0F2A1C,#0A1F15);border-left:4px solid #2ECC8F;}
.air-hero .eyebrow{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin-bottom:5px;opacity:.9;}
.air-hero.red .eyebrow{color:#FF8B8B;}
.air-hero.blue .eyebrow{color:#8FBBF0;}
.air-hero.green .eyebrow{color:#6FE0AE;}
.air-hero h4{margin:0 0 6px;font-size:14.5px;font-weight:700;}
.air-hero p{margin:0;font-size:12px;color:#C7C4D6;line-height:1.6;}
.air-card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:9px;overflow:hidden;}
.air-card.red{border-left:3px solid #E14F4F;}
.air-card.blue{border-left:3px solid #4E8FE0;}
.air-card-hd{display:flex;gap:11px;align-items:center;padding:13px 14px;cursor:pointer;}
.air-icon{font-size:19px;flex-shrink:0;}
.air-rank{width:29px;height:29px;border-radius:9px;background:var(--violet-soft);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--violet-deep);flex-shrink:0;}
.air-tag{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px;}
.air-tag.red{color:#D64545;}
.air-card-title{font-size:13px;font-weight:600;line-height:1.4;}
.air-card-body{padding:0 14px 13px;}
.air-card-detail{font-size:12.5px;color:var(--sub);line-height:1.6;margin-bottom:9px;}
.air-fix-box{background:#E7F8EF;border-radius:10px;padding:10px 12px;font-size:12px;color:#175530;line-height:1.5;}
[data-theme="dark"] .air-fix-box{background:#123322;color:#8CE0B5;}
.air-action-box{background:var(--violet-soft);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--violet-deep);line-height:1.5;}
.edge-item{display:flex;gap:11px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:9px;}
.edge-num{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;margin-top:1px;}
.edge-impact{font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:999px;flex-shrink:0;margin-top:2px;}
.edge-title{font-size:13.5px;font-weight:700;margin-bottom:3px;}
.edge-desc{font-size:12.5px;color:var(--sub);line-height:1.55;}
.personal-edge-card{background:linear-gradient(135deg,#241C4A,#15102E);color:#fff;border-radius:16px;padding:18px;margin-top:6px;}
.personal-edge-card h4{margin:0 0 8px;font-size:13.5px;color:#B9A9FF;}
.personal-edge-card p{margin:0;font-size:12.5px;color:#D6D2EA;line-height:1.75;}
.personal-edge-card .highlight{color:#fff;}
.personal-edge-card .accent{color:#7CE0B5;font-weight:600;}

/* ---------- HW LOG ---------- */
.hw-top-strip{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
.hw-top-cell{border-radius:12px;padding:12px 10px;text-align:center;border:1px solid var(--line);}
.hw-top-val{font-size:20px;font-weight:800;font-family:'Fredoka',sans-serif;}
.hw-top-label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--sub);margin-top:2px;}
.hw-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:9px;}
.hw-card-top{display:flex;gap:9px;align-items:center;margin-bottom:5px;}
.hw-subj-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.reminder-section-hd{font-size:11px;font-weight:800;color:var(--violet-deep);background:var(--violet-soft);border-radius:8px;padding:5px 10px;margin:12px 0 8px;display:inline-block;}
.todo-card{background:var(--card);border:1.5px solid var(--violet);border-radius:16px;padding:14px 16px;margin-bottom:16px;}
.todo-hd{font-size:13.5px;font-weight:700;margin-bottom:10px;}
.todo-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
.todo-row:last-child{border-bottom:none;}
.todo-upcoming-hd{font-size:10px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 4px;}
.hw-topic{flex:1;font-size:13.5px;font-weight:700;}
.hw-status-badge{font-size:10px;font-weight:800;padding:2px 9px;border-radius:999px;flex-shrink:0;}
.hw-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--sub);margin-bottom:6px;}
.hw-subj-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;}
.hw-prog-wrap{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.hw-prog-bar{flex:1;height:5px;border-radius:99px;background:var(--violet-soft);overflow:hidden;}
.hw-prog-fill{height:100%;border-radius:99px;}
.hw-prog-text{font-size:11px;font-weight:800;width:34px;text-align:right;}
.hw-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;}

/* ---------- GOALS / MILESTONES ---------- */
.goal-row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);}
.goal-row:last-child{border-bottom:none;}
.goal-cbx{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;cursor:pointer;}
.goal-cbx.on{background:var(--mint);border-color:var(--mint);}
.ch-tick{color:#fff;font-size:12px;font-weight:800;}
.goal-title{font-size:13.5px;font-weight:700;}
.goal-title.done{text-decoration:line-through;color:var(--sub);}

/* ---------- CREATOR FOOTER ---------- */
.creator-footer{text-align:center;padding:26px 16px 10px;color:var(--sub);font-size:12px;}
.creator-footer a{color:var(--violet-deep);font-weight:700;text-decoration:none;}
.li-badge{display:inline-flex;align-items:center;gap:6px;background:var(--violet-soft);color:var(--violet-deep);padding:6px 14px;border-radius:999px;font-weight:700;font-size:12.5px;margin-top:8px;text-decoration:none;}
.li-badge:hover{background:var(--violet);color:#fff;}
</style>
</head>

const STORE_KEY = "ca_karo_tracker_v1";
function defaultState(){
  const chapters = {};
  SUBJECT_KEYS.forEach(k=>{
    chapters[k] = SUBJECTS[k].chapters.map((name,i)=>({
      id:k+"_"+i, name, firstRead:false, firstReadDate:null, priority:autoPriority(k,i), notes:"",
      stages:{lecture:false, revlecture:false, reading:false, questions:false},
      starCount:6, starsFilled:0, revStages:{} // {1:true,7:true,...}
    }));
  });
  return {
    profile:{name:"", examDate:"", theme:"light", group:"BOTH"},
    settings:{pomodoro:{work:25,brk:5,longBrk:15,every:4}, revisionOffsets:[1,3,7,16,35], goodDayH:8, decentDayH:6, lastBackupAt:null, waterGoal:8, breakReminderMin:50},
    chapters,
    wellness:{water:{}, sleep:{}, mood:{}}, // date-keyed logs — water: glasses count, sleep: hours, mood: 'great'|'ok'|'low'
    sessions:[], // {id,subject,chapter,activity,mode,start,end,durationMin,status}
    tests:[], // {id,paper,type,date,durationMin,marks,total,status}
    flashpoints:[], // {id,subject,chapter,text,starred}
    homework:[], // {id,date,subject,topic,questionRange,totalQuestions,completedQuestions,notes,status}
    goals: GOALS_MILESTONES.map(()=>false),
    finalRevPasses:3,
    lastRevisionPromptDate:null,
    lastHWPromptDate:null,
    activeSession:null, // persisted running/paused timer — survives closing the app
    onboarded:false,
    security:{pinHash:null, enabled:false}
  };
}
let storageOK = true;
let memoryStore = null; // fallback when localStorage is blocked (sandboxed preview, private mode, etc.)
let state = load();
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return migrateState(parsed);
  }catch(e){
    // localStorage may be unreadable (sandboxed preview / private mode). Fall back silently.
    storageOK = false;
    return defaultState();
  }
}
function migrateState(parsed){
  const d = defaultState();
  const merged = Object.assign(d, parsed, {chapters: parsed.chapters || d.chapters, settings: Object.assign(d.settings, parsed.settings||{}), profile: Object.assign(d.profile, parsed.profile||{})});
  // migrate: ensure every chapter has a priority tag + stage tracker
  SUBJECT_KEYS.forEach(k=>{
    (merged.chapters[k]||[]).forEach((c,i)=>{
      if(!c.priority) c.priority = autoPriority(k,i);
      if(!c.stages) c.stages = {lecture:false, revlecture:false, reading:false, questions:false, ...( c.firstRead? {lecture:true,reading:true,questions:true,revlecture:true} : {})};
      if(c.starCount===undefined) c.starCount = 6;
      if(c.starsFilled===undefined) c.starsFilled = c.firstRead? c.starCount : 0;
    });
  });
  if(!merged.homework) merged.homework = [];
  merged.homework.forEach(hw=>{
    if(hw.completedDate===undefined) hw.completedDate = null;
    // back-fill: if an old entry is already fully done but has no completedDate, assume it was completed when logged
    if(hw.completedDate===null){
      const total = Number(hw.totalQuestions)||0, comp = Number(hw.completedQuestions)||0;
      if(total>0 && comp>=total) hw.completedDate = hw.date;
    }
    if(hw.dueDate===undefined) hw.dueDate = null;
    if(hw.remindedAt===undefined) hw.remindedAt = null;
  });
  if(merged.lastHWPromptDate===undefined) merged.lastHWPromptDate = null;
  if(!merged.goals || merged.goals.length!==GOALS_MILESTONES.length) merged.goals = GOALS_MILESTONES.map((_,i)=> (merged.goals&&merged.goals[i]) || false);
  // Discard any activeSession that doesn't have a valid timestamp anchor — this catches
  // leftover data from older versions of the app (before the timer was rebuilt on real
  // timestamps) that would otherwise restore as a permanently frozen "00:00:00" timer.
  if(merged.activeSession){
    const s = merged.activeSession;
    const validStart = s.startedAt && !isNaN(new Date(s.startedAt).getTime());
    if(!validStart) merged.activeSession = null;
  }
  if(merged.activeSession===undefined) merged.activeSession = null;
  if(!merged.wellness) merged.wellness = {water:{}, sleep:{}, mood:{}};
  if(!merged.wellness.water) merged.wellness.water = {};
  if(!merged.wellness.sleep) merged.wellness.sleep = {};
  if(!merged.wellness.mood) merged.wellness.mood = {};
  // upgrade the old 1-3-7-14 day default to the classic 1-3-7-16-35 spaced-repetition
  // schedule — only if the user never customized their offsets themselves
  if(JSON.stringify(merged.settings.revisionOffsets)===JSON.stringify([1,3,7,14])){
    merged.settings.revisionOffsets = [1,3,7,16,35];
  }
  if(merged.settings.waterGoal===undefined) merged.settings.waterGoal = 8;
  if(merged.settings.breakReminderMin===undefined) merged.settings.breakReminderMin = 50;
  if(!merged.security) merged.security = {pinHash:null, enabled:false};
  return merged;
}
function save(){
  // CRITICAL: this must never throw — every button handler calls save() then render().
  // If setItem throws (blocked storage, quota, sandboxed iframe) and we don't catch it,
  // render() never runs and the whole UI looks frozen/unresponsive.
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    storageOK = true;
  }catch(e){
    storageOK = false;
    memoryStore = state; // keep working in-memory for the rest of this session
  }
}
function uid(){ return Math.random().toString(36).slice(2,10); }
/* Simple client-side hash for the access PIN. This only gates casual access on a shared
   device — it's stored in localStorage on the same device, so it is NOT cryptographic
   security against someone with access to the device's storage/devtools. */
function simpleHash(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (Math.imul(31,h) + str.charCodeAt(i))|0; }
  return String(h);
}
function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
/* Auto-growing textarea — used for Topic/Notes fields so long text wraps onto new lines
   and stays fully visible, instead of overflowing sideways in a single-line input. */
function autoGrow(el){
  el.style.height = 'auto';
  el.style.height = (el.scrollHeight)+'px';
}
function triggerDownload(filename, content, mime){
  try{
    const blob = new Blob([content], {type: mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.style.display='none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    return true;
  }catch(e){
    // Downloads can be blocked in sandboxed previews — fall back to a copyable modal
    // so the person never loses their data even when the browser won't save a file.
    openModal(`
      <h2>Download blocked here</h2>
      <p style="color:var(--sub);">This preview won't let the browser save a file. Copy the text below and save it manually as <b>${filename}</b> — or open this app in a normal browser tab, where downloads work directly.</p>
      <textarea id="dlFallbackText" style="width:100%;height:220px;font-family:monospace;font-size:11px;padding:10px;border-radius:10px;border:1px solid var(--line);" readonly>${content.replace(/</g,'&lt;')}</textarea>
      <button class="btn" style="width:100%;margin-top:10px;" onclick="document.getElementById('dlFallbackText').select();document.execCommand('copy');toast('Copied!')">Copy to clipboard</button>
    `);
    return false;
  }
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------- date helpers ---------- */
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function fmtDate(iso){ if(!iso) return "—"; const d=new Date(iso); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function addDays(iso,n){ const d=new Date(iso); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function minToHM(min){ const h=Math.floor(min/60), m=Math.round(min%60); return h>0? `${h}h ${m}m` : `${m}m`; }

/* ---------- derived stats ---------- */
function totalChapters(){ return SUBJECT_KEYS.reduce((s,k)=>s+state.chapters[k].length,0); }
function firstReadCount(){ return SUBJECT_KEYS.reduce((s,k)=>s+state.chapters[k].filter(c=>c.firstRead).length,0); }
function subjectProgress(k){ const chs=state.chapters[k]; return Math.round(100*chs.filter(c=>c.firstRead).length/chs.length); }
function subjectMinutes(k){ return state.sessions.filter(s=>s.subject===k && s.durationMin).reduce((s,x)=>s+x.durationMin,0); }
function totalMinutes(){ return state.sessions.reduce((s,x)=>s+(x.durationMin||0),0); }
function sessionsByDate(){ const map={}; state.sessions.forEach(s=>{ const d=s.start.slice(0,10); map[d]=(map[d]||0)+(s.durationMin||0); }); return map; }
function currentStreak(){
  const map = sessionsByDate(); let streak=0; let d = todayISO();
  if(!map[d]){ d = addDays(d,-1); if(!map[d]) return 0; }
  while(map[d]){ streak++; d = addDays(d,-1); }
  return streak;
}
function last7DaysMinutes(){
  const map = sessionsByDate(); let total=0;
  for(let i=0;i<7;i++){ total += map[addDays(todayISO(),-i)]||0; }
  return total;
}
const PRI_WEIGHT = {A:3,B:2,C:1};
function priorityReadinessPct(){
  const all = SUBJECT_KEYS.flatMap(k=>state.chapters[k]);
  if(!all.length) return 0;
  const totalW = all.reduce((s,c)=>s+PRI_WEIGHT[c.priority||'B'],0);
  const doneW = all.filter(c=>c.firstRead).reduce((s,c)=>s+PRI_WEIGHT[c.priority||'B'],0);
  return totalW? Math.round(100*doneW/totalW) : 0;
}
function subjectPriorityReadiness(k){
  const chs = state.chapters[k];
  const totalW = chs.reduce((s,c)=>s+PRI_WEIGHT[c.priority||'B'],0);
  const doneW = chs.filter(c=>c.firstRead).reduce((s,c)=>s+PRI_WEIGHT[c.priority||'B'],0);
  return totalW? doneW/totalW : 0; // 0..1
}
function daysToExam(){ if(!state.profile.examDate) return null; return Math.max(0,daysBetween(todayISO(), state.profile.examDate)); }

/* revision due calc */
function revisionsDue(){
  const due=[]; const today=todayISO();
  SUBJECT_KEYS.forEach(k=>{
    state.chapters[k].forEach(c=>{
      if(!c.firstRead || !c.firstReadDate) return;
      state.settings.revisionOffsets.forEach((off,idx)=>{
        const stage = idx+1;
        if(c.revStages[stage]) return;
        const dueDate = addDays(c.firstReadDate, off);
        if(dueDate<=today){ due.push({subject:k, chapter:c, stage, dueDate}); }
      });
    });
  });
  return due.sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
}
function reviewYesterday(){
  const y = addDays(todayISO(),-1);
  return state.sessions.filter(s=>s.start.slice(0,10)===y);
}

  document.getElementById('mb').onclick = (e)=>{ if(e.target.id==='mb') closeModal(); };
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

function greeting(){
  const h = new Date().getHours();
  if(h<5) return "Good night";
  if(h<12) return "Good morning";
  if(h<17) return "Good afternoon";
  if(h<21) return "Good evening";
  return "Good night";
}

function todayWater(){ return state.wellness.water[todayISO()]||0; }
function adjustWater(delta){
  const d = todayISO();
  const cur = state.wellness.water[d]||0;
  state.wellness.water[d] = Math.max(0, Math.min(20, cur+delta));
  save(); refreshWellnessCard();
}
function sleep7dAvg(){
  const vals=[];
  for(let i=0;i<7;i++){ const d=addDays(todayISO(),-i); if(state.wellness.sleep[d]!=null) vals.push(state.wellness.sleep[d]); }
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
function logSleep(hours){
  state.wellness.sleep[todayISO()] = hours;
  save(); toast('Sleep logged 😴'); refreshWellnessCard();
}
function logMood(m){
  state.wellness.mood[todayISO()] = m;
  save(); refreshWellnessCard();
}
function refreshWellnessCard(){
  const el = document.getElementById('wellnessCard');
  if(el){ el.outerHTML = wellnessCardHTML(); } else { render(); }
}

function startSession(){
  const subject = document.getElementById('cfgSubject').value;
  const chapter = document.getElementById('cfgChapter').value;
  sessionDraft.subject = subject; sessionDraft.chapter = chapter;
  sessionDraft.id = uid();
  sessionDraft.start = new Date().toISOString();      // original start — never changes, used for the session record
  sessionDraft.startedAt = sessionDraft.start;          // timestamp anchor for elapsed-time math
  sessionDraft.pausedAt = null;                         // set while paused
  sessionDraft.totalPausedMs = 0;                       // accumulated pause time, subtracted from elapsed
  sessionDraft.status = 'running';
  sessionDraft.phase = 'work';
  sessionDraft.phaseStartedAt = sessionDraft.start;
  sessionDraft.breakRemindersGiven = 0;
  persistActiveSession();
  startTickInterval();
  render();
}
/* Elapsed is always DERIVED from real timestamps, never from an incrementing counter —
   this is what makes it survive backgrounding, throttling, and closing the app entirely. */
function computeElapsedSec(d){
  if(!d || !d.startedAt) return 0;
  const end = d.pausedAt ? new Date(d.pausedAt).getTime() : Date.now();
  const raw = end - new Date(d.startedAt).getTime() - (d.totalPausedMs||0);
  if(isNaN(raw)) return 0;
  return Math.max(0, Math.floor(raw/1000));
}
function computePhaseElapsedSec(d){
  if(!d || !d.phaseStartedAt) return 0;
  const end = d.pausedAt ? new Date(d.pausedAt).getTime() : Date.now();
  const raw = end - new Date(d.phaseStartedAt).getTime() - (d.phasePausedMs||0);
  if(isNaN(raw)) return 0;
  return Math.max(0, Math.floor(raw/1000));
}
function persistActiveSession(){
  state.activeSession = sessionDraft? {...sessionDraft} : null;
  save();
}
function startTickInterval(){
  if(timerHandle) clearInterval(timerHandle);
  timerHandle = setInterval(tick, 1000);
}
function tick(){
  if(!sessionDraft || sessionDraft.paused) return;
  const elapsed = computeElapsedSec(sessionDraft);
  const disp = document.getElementById('timerDisplay');
  if(disp) disp.textContent = hms(elapsed);
  // Break reminders — live-timer sessions only (Pomodoro already alternates work/break on its own).
  if(sessionDraft.mode==='live'){
    const intervalSec = (state.settings.breakReminderMin||50)*60;
    const given = sessionDraft.breakRemindersGiven||0;
    if(intervalSec>0 && elapsed >= intervalSec*(given+1)){
      sessionDraft.breakRemindersGiven = given+1;
      toast('🌿 Break time — stretch, sip water, rest your eyes for a minute');
      persistActiveSession();
    }
  }
  if(sessionDraft.mode==='pomodoro'){
    const phaseElapsed = computePhaseElapsedSec(sessionDraft);
    const limit = (sessionDraft.phase==='work'? state.settings.pomodoro.work : state.settings.pomodoro.brk)*60;
    if(phaseElapsed>=limit){
      sessionDraft.phase = sessionDraft.phase==='work'?'break':'work';
      sessionDraft.phaseStartedAt = new Date().toISOString();
      sessionDraft.phasePausedMs = 0;
      toast(sessionDraft.phase==='break'?'Break time 🍃':'Back to work 💪');
      persistActiveSession();
      render();
    }
  }
}
function hms(sec){
  const h=String(Math.floor(sec/3600)).padStart(2,'0');
  const m=String(Math.floor(sec/60)%60).padStart(2,'0');
  const s=String(sec%60).padStart(2,'0');
  return `${h}:${m}:${s}`;
}

function pauseResumeSession(){
  if(sessionDraft.paused){
    // resume: fold the just-finished pause into totalPausedMs, clear pausedAt
    const pausedMs = Date.now() - new Date(sessionDraft.pausedAt).getTime();
    sessionDraft.totalPausedMs = (sessionDraft.totalPausedMs||0) + pausedMs;
    if(sessionDraft.mode==='pomodoro') sessionDraft.phasePausedMs = (sessionDraft.phasePausedMs||0) + pausedMs;
    sessionDraft.pausedAt = null;
    sessionDraft.paused = false;
    startTickInterval();
  } else {
    sessionDraft.pausedAt = new Date().toISOString();
    sessionDraft.paused = true;
    clearInterval(timerHandle);
  }
  persistActiveSession();
  render();
}
function endSession(status){
  status = 'complete'; // in-progress session status removed — every ended session is complete
  clearInterval(timerHandle); timerHandle=null;
  stopBrownNoise();
  const d = sessionDraft;
  const elapsed = computeElapsedSec(d);
  const durationMin = Math.round(elapsed/60) || 1;
  state.sessions.push({id:d.id, subject:d.subject, chapter:d.chapter, activity:d.activity, mode:d.mode, topic:d.topic||'', start:d.start, end:new Date().toISOString(), durationMin, status});
  markStageFromActivity(d.subject, d.chapter, d.activity);
  sessionDraft = null;
  state.activeSession = null;
  save();
  toast('Session completed 🎉');
  render();
}
function markStageFromActivity(subject, chapterName, activityId){
  const ch = state.chapters[subject].find(c=>c.name===chapterName);
  if(!ch) return;
  if(!ch.stages) ch.stages = {lecture:false, revlecture:false, reading:false, questions:false};
  if(STAGE_ORDER.includes(activityId)){
    ch.stages[activityId] = true;
    syncFirstRead(ch);
  }
}
function cancelSession(){
  if(!confirm('Discard this session? The time won\'t be logged.')) return;
  clearInterval(timerHandle); timerHandle=null;
  stopBrownNoise();
  sessionDraft=null; state.activeSession=null; save(); render();
}
function resumeSession(id){
  const s = state.sessions.find(x=>x.id===id);
  if(!s) return;
  const startedAt = new Date(Date.now() - (s.durationMin||0)*60000).toISOString();
  sessionDraft = {id:s.id, subject:s.subject, chapter:s.chapter, activity:s.activity, mode:s.mode, topic:s.topic||'', start:s.start, startedAt, pausedAt:null, totalPausedMs:0, status:'running', phase:'work', phaseStartedAt:startedAt};
  state.sessions = state.sessions.filter(x=>x.id!==id);
  persistActiveSession();
  startTickInterval();
  go('session');
}
function restoreActiveSessionOnLoad(){
  if(state.activeSession && state.activeSession.startedAt && !isNaN(new Date(state.activeSession.startedAt).getTime())){
    sessionDraft = {...state.activeSession};
    startTickInterval();
  } else if(state.activeSession){
    // corrupted/legacy session data slipped through — clear it rather than showing a stuck timer
    state.activeSession = null;
    save();
  }
}

/* ---------- FOCUS EXTRAS: brown noise, fullscreen, picture-in-picture ---------- */
let noiseCtx=null, noiseSource=null;
function toggleBrownNoise(){
  if(noiseSource){ stopBrownNoise(); render(); return; }
  try{
    noiseCtx = new (window.AudioContext||window.webkitAudioContext)();
    const bufferSize = 2*noiseCtx.sampleRate;
    const buffer = noiseCtx.createBuffer(1, bufferSize, noiseCtx.sampleRate);
    const data = buffer.getChannelData(0);
    let lastOut = 0;
    for(let i=0;i<bufferSize;i++){
      const white = Math.random()*2-1;
      data[i] = (lastOut + (0.02*white))/1.02;
      lastOut = data[i];
      data[i] *= 3.5;
    }
    noiseSource = noiseCtx.createBufferSource();
    noiseSource.buffer = buffer;
    noiseSource.loop = true;
    const gain = noiseCtx.createGain();
    gain.gain.value = 0.22;
    noiseSource.connect(gain).connect(noiseCtx.destination);
    noiseSource.start();
  }catch(e){ toast('Audio not available in this browser'); }
  render();
}
function stopBrownNoise(){
  if(noiseSource){ try{ noiseSource.stop(); }catch(e){} noiseSource=null; }
  if(noiseCtx){ try{ noiseCtx.close(); }catch(e){} noiseCtx=null; }
}
function toggleTimerFullscreen(){
  if(!document.fullscreenElement){ document.documentElement.requestFullscreen?.().catch(()=>toast('Fullscreen not available')); }
  else{ document.exitFullscreen?.(); }
}
let pipCanvas=null, pipVideoEl=null, pipInterval=null;
async function togglePiP(){
  if(document.pictureInPictureElement){ await document.exitPictureInPicture(); return; }
  if(!('pictureInPictureEnabled' in document)){ toast('Picture-in-Picture isn\'t supported on this browser'); return; }
  try{
    if(!pipCanvas){ pipCanvas=document.createElement('canvas'); pipCanvas.width=360; pipCanvas.height=200; }
    const ctx = pipCanvas.getContext('2d');
    const draw = ()=>{
      if(!sessionDraft) return;
      ctx.fillStyle='#1c1440'; ctx.fillRect(0,0,360,200);
      ctx.fillStyle='#EDE8FF'; ctx.font='bold 15px sans-serif'; ctx.textAlign='center';
      ctx.fillText(`${sessionDraft.subject} · ${(sessionDraft.chapter||'').slice(0,28)}`, 180, 46);
      ctx.fillStyle='#fff'; ctx.font='bold 46px monospace';
      ctx.fillText(hms(computeElapsedSec(sessionDraft)), 180, 110);
      ctx.fillStyle='#B9A9FF'; ctx.font='13px sans-serif';
      ctx.fillText((ACTIVITIES.find(a=>a.id===sessionDraft.activity)||{}).label||'', 180, 145);
    };
    draw();
    if(pipInterval) clearInterval(pipInterval);
    pipInterval = setInterval(draw, 1000);
    if(!pipVideoEl){
      pipVideoEl = document.createElement('video');
      pipVideoEl.muted = true; pipVideoEl.playsInline = true; pipVideoEl.style.cssText='position:fixed;bottom:0;right:0;width:1px;height:1px;opacity:0;pointer-events:none;';
      document.body.appendChild(pipVideoEl);
    }
    pipVideoEl.srcObject = pipCanvas.captureStream(2);
    await pipVideoEl.play();
    await pipVideoEl.requestPictureInPicture();
  }catch(e){ toast('Picture-in-Picture not available right now'); }
}
document.addEventListener('leavepictureinpicture', ()=>{ if(pipInterval){ clearInterval(pipInterval); pipInterval=null; } });

let syllabusOpenPapers = Object.fromEntries(SUBJECT_KEYS.map(k=>[k,false])); // collapsed by default — tap a subject name to expand it
let syllabusSearch = "";
function setSylFilter(f){ syllabusFilter=f; render(); }
function toggleSylPaper(k){ syllabusOpenPapers[k] = !syllabusOpenPapers[k]; render(); }
function sylExpandAll(){ activeSubjectKeys().forEach(k=>syllabusOpenPapers[k]=true); render(); }
function sylCollapseAll(){ activeSubjectKeys().forEach(k=>syllabusOpenPapers[k]=false); render(); }

function bulkMarkSubject(k, done){
  if(!confirm(done? `Mark every chapter in ${SUBJECTS[k].name} as fully complete? This is meant for chapters you'd already covered before using this tracker.` : `Reset every chapter in ${SUBJECTS[k].name} back to not-started?`)) return;
  state.chapters[k].forEach(c=>{
    STAGE_ORDER.forEach(s=> c.stages[s] = done);
    c.starsFilled = done? (c.starCount||6) : 0;
    syncFirstRead(c);
  });
  save(); toast(done? `${k} marked fully complete` : `${k} reset`); render();
}

function syllabusStats(keys){
  let total=0, done=0, aTotal=0, aDone=0;
  keys.forEach(k=>{
    state.chapters[k].forEach(c=>{
      total++; if(c.firstRead) done++;
      if(c.priority==='A'){ aTotal++; if(c.firstRead) aDone++; }
    });
  });
  return {total,done,aTotal,aDone};
}

      return `<button class="pri-filter ${f} ${syllabusFilter===f?'on':''}" onclick="setSylFilter('${f}')">${lbl}</button>`;
    }).join('')}

  <div class="syl-stat-row">
    <div class="syl-stat"><div class="lbl">Overall</div><div class="val">${pct}%</div></div>
    <div class="syl-stat" style="border-left:3px solid #D64545;"><div class="lbl" style="color:#D64545">A done</div><div class="val" style="color:#D64545">${aPct}%</div></div>

const STAGE_ORDER = ["lecture","revlecture","reading","questions"];
function chapterStagePct(c){
  const done = STAGE_ORDER.filter(s=>c.stages && c.stages[s]).length;
  return Math.round(100*done/STAGE_ORDER.length);
}
let chapterExpanded = {}; // per-chapter-id expand state for the detail row (stage-dots + stars + notes)

function syncFirstRead(c){
  const wasFirstRead = c.firstRead;
  c.firstRead = chapterStagePct(c)===100;
  if(c.firstRead && !c.firstReadDate) c.firstReadDate = todayISO();
  return c.firstRead && !wasFirstRead; // true only on the exact transition to complete
}
function toggleStage(subjKey, id, stageId){
  const c = state.chapters[subjKey].find(x=>x.id===id);
  if(!c.stages) c.stages = {lecture:false, revlecture:false, reading:false, questions:false};
  c.stages[stageId] = !c.stages[stageId];
  const justCompleted = syncFirstRead(c);
  save();
  if(justCompleted) toast(`✓ ${c.name} complete — revisions scheduled for day ${state.settings.revisionOffsets.join('/')}`);
  render();
}
function toggleAllStages(subjKey, id){
  const c = state.chapters[subjKey].find(x=>x.id===id);
  const full = chapterStagePct(c)===100;
  STAGE_ORDER.forEach(s=> c.stages[s] = !full);
  const justCompleted = syncFirstRead(c);
  save();
  toast(full? 'Chapter unmarked' : (justCompleted? `✓ Complete! Revisions scheduled for day ${state.settings.revisionOffsets.join('/')}` : 'Chapter marked complete 🎉'));
  render();
}

/* ---------- LECTURE STAR TRACKER (⭐⭐⭐...🌟 Super Star) ---------- */
function editStarCount(subjKey, id){
  const c = state.chapters[subjKey].find(x=>x.id===id);
  const input = prompt('How many lecture stars for this chapter? (the last one is always the Super Star)', c.starCount||6);
  if(input===null) return;
  const n = Math.max(2, Math.min(20, parseInt(input)||6));
  c.starCount = n;
  if(c.starsFilled > n) c.starsFilled = n;
  save(); render();
}
function toggleLectureStar(subjKey, id, n){
  const c = state.chapters[subjKey].find(x=>x.id===id);
  const starCount = c.starCount||6;
  const isSuperStar = n===starCount;

  if(isSuperStar){
    // The Super Star is the ONLY star that can complete the chapter.
    // Clicking it mirrors "mark all stages done" so the % ring, dashboard,
    // and revision schedule all stay perfectly in sync with this new state.
    const wasFull = chapterStagePct(c)===100;
    if(!wasFull){
      STAGE_ORDER.forEach(s=> c.stages[s] = true);
      c.starsFilled = starCount;
      const justCompleted = syncFirstRead(c);
      save();
      toast(`🌟 Super Star! ${c.name} is 100% complete — revisions scheduled for day ${state.settings.revisionOffsets.join('/')}`);
      render();
    } else {
      // toggle back off — un-complete the chapter
      STAGE_ORDER.forEach(s=> c.stages[s] = false);
      c.starsFilled = Math.max(0, starCount-1);
      syncFirstRead(c);
      save(); toast('Chapter unmarked'); render();
    }
    return;
  }

  // Regular star: purely tracks how many lectures you've watched so far.
  // It NEVER marks the chapter complete on its own — only the Super Star does.
  c.starsFilled = (c.starsFilled===n)? n-1 : n;
  if(c.starsFilled >= starCount) c.starsFilled = starCount-1; // regular stars can never reach the super-star slot on their own
  save(); render();
}

function cyclePriority(subjKey, id){
  const c = state.chapters[subjKey].find(x=>x.id===id);
  const idx = PRI_CYCLE.indexOf(c.priority);
  c.priority = PRI_CYCLE[(idx+1)%PRI_CYCLE.length];
  save(); render();
}
function openNotes(subj, id){
  const c = state.chapters[subj].find(x=>x.id===id);

}

  const todayCompleted = state.homework.filter(e=>e.completedDate===todayISO());
  const pendingBacklog = state.homework.filter(e=>hwStatus(e)!=='done');

  let h = `

    ${hwShowForm? hwFormHTML() : ''}

      <div class="section-title" style="margin:18px 0 8px;">Logged ${d===todayISO()?'today':'on '+fmtDate(d)}</div>

    `;
  } else {
    const {start,end} = hwRangeDates();
    const inRange = base.filter(e=>e.date>=start && e.date<=end);
    const doneCount = inRange.filter(e=>hwStatus(e)==='done').length;
    const activeCount = inRange.filter(e=>hwStatus(e)==='in-progress').length;
    const pendingCount = inRange.filter(e=>hwStatus(e)==='pending').length;
    const qDone = inRange.reduce((s,e)=>s+(Number(e.completedQuestions)||0),0);
    const qTotal = inRange.reduce((s,e)=>s+(Number(e.totalQuestions)||0),0);

    h += `
    <div class="chiprow" style="margin-top:14px;">
      <span class="chip ${hwHistoryRange==='7'?'active':''}" onclick="hwSetHistoryRange('7')">Last 7 days</span>
      <span class="chip ${hwHistoryRange==='30'?'active':''}" onclick="hwSetHistoryRange('30')">Last 30 days</span>
      <span class="chip ${hwHistoryRange==='custom'?'active':''}" onclick="hwSetHistoryRange('custom')">Custom</span>
    </div>
    ${hwHistoryRange==='custom'? `
    <div class="two-col" style="margin-bottom:14px;">
      <div class="field"><label class="field-label">From</label><input type="date" id="hwCustomStart" value="${hwCustomStart}" onchange="hwSetCustomRange()"></div>
      <div class="field"><label class="field-label">To</label><input type="date" id="hwCustomEnd" value="${hwCustomEnd}" onchange="hwSetCustomRange()"></div>

    <div class="grid cols-3">
      <div class="card"><div class="stat-num" style="color:#1D9C63;">${doneCount}</div><div class="stat-label" style="color:var(--sub);">Done</div></div>
      <div class="card"><div class="stat-num" style="color:#9C6B00;">${activeCount}</div><div class="stat-label" style="color:var(--sub);">Active</div></div>
      <div class="card"><div class="stat-num" style="color:#D64545;">${pendingCount}</div><div class="stat-label" style="color:var(--sub);">Pending</div></div>
    </div>
    <div class="card" style="margin-top:12px;display:flex;justify-content:space-between;align-items:center;">
      <span style="color:var(--sub);font-size:13.5px;">Questions done</span>
      <span style="font-family:'Fredoka',sans-serif;font-size:20px;font-weight:700;color:var(--violet-deep);">${qDone}/${qTotal||0}</span>
    </div>

    <div class="section-title" style="margin-top:18px;">Per subject</div>
    <div class="card">
      ${activeSubjectKeys().map(k=>{
        const subjEntries = inRange.filter(e=>e.subject===k);
        const subjDone = subjEntries.filter(e=>hwStatus(e)==='done').length;
        return `<div class="list-row"><span class="hw-subj-dot" style="background:${SUBJECTS[k].color}"></span><div style="flex:1;">${SUBJECTS[k].name}</div><div style="color:var(--sub);font-weight:700;">${subjEntries.length? `${subjDone}/${subjEntries.length}` : '—'}</div></div>`;
      }).join('')}
    </div>
    `;

    const done = base.filter(e=>hwStatus(e)==='done');
    const groupedByCompletion = {};
    done.forEach(e=>{ const key = e.completedDate || 'unknown'; (groupedByCompletion[key]=groupedByCompletion[key]||[]).push(e); });
    const compDates = Object.keys(groupedByCompletion).sort((a,b)=>b.localeCompare(a));
    h += `<div style="margin-top:18px;">
    <div class="section-title">Completed entries</div>
    ${compDates.length? compDates.map(d=>`
      <div class="section-title" style="margin:18px 0 8px;">✓ Completed ${d===todayISO()?'today':(d==='unknown'?'(date unknown)':'on '+fmtDate(d))}</div>
      ${groupedByCompletion[d].map(hwEntryCardHTML).join('')}
    `).join('') : `<div class="empty" style="padding:24px 0;"><div class="big">📊</div><h3>Nothing completed yet</h3><p>Finished homework will show up here grouped by the exact date you completed it.</p></div>`}
    </div>`;
  }

  return h;
}

function hwSubmit(){
  const topic = document.getElementById('hwfTopic').value.trim();
  if(!topic){ toast('Add a topic first'); return; }
  const total = parseInt(document.getElementById('hwfTotal').value)||0;
  const comp = parseInt(document.getElementById('hwfComp').value)||0;
  const loggedDate = document.getElementById('hwfDate').value || todayISO();
  state.homework.push({
    id: uid(),
    date: loggedDate,
    dueDate: document.getElementById('hwfDue').value || null,
    subject: document.getElementById('hwfSubject').value,
    topic,
    questionRange: document.getElementById('hwfQR').value.trim(),
    totalQuestions: total,
    completedQuestions: comp,
    completedDate: (total>0 && comp>=total) ? todayISO() : null,
    notes: document.getElementById('hwfNotes').value.trim(),
    remindedAt: null
  });
  hwShowForm = false;
  save(); toast('Homework logged'); render();
}

    </div>
    ${total>0? `<div class="hw-prog-wrap"><div class="hw-prog-bar"><div class="hw-prog-fill" style="width:${pct}%;background:${status==='done'?'#1D9C63':status==='in-progress'?'#9C6B00':'#D64545'}"></div></div><div class="hw-prog-text">${pct}%</div></div>`:''}
    <div style="font-size:11px;color:var(--sub);margin-bottom:6px;">
      Logged ${fmtDate(e.date)}${status==='done'&&e.completedDate? ` · <span style="color:#1D9C63;font-weight:700;">✓ completed ${e.completedDate===todayISO()?'today':fmtDate(e.completedDate)}</span>` : ''}
      ${status!=='done'&&e.dueDate? ` · <span style="color:${e.dueDate<todayISO()?'#D64545':'var(--violet-deep)'};font-weight:700;">${e.dueDate<todayISO()?'overdue since':'due'} ${fmtDate(e.dueDate)}</span>` : ''}

      ${status!=='done'&&e.dueDate? `<button class="btn sm ghost" onclick="addHWToPhone('${e.id}')">📅 Add to phone</button>`:''}
      <button class="btn sm ghost" onclick="hwEditId='${e.id}';render();">Update Qs</button>
      <button class="btn sm warn" onclick="hwDelete('${e.id}')">Delete</button>
    </div>
  </div>`;
}
function hwMarkDone(id){
  const e = state.homework.find(x=>x.id===id);
  e.totalQuestions = Number(e.totalQuestions)||1;
  e.completedQuestions = e.totalQuestions;
  e.completedDate = todayISO();
  save(); toast('Marked complete — recorded today 🎉'); render();
}
function hwSaveEdit(id){
  const e = state.homework.find(x=>x.id===id);
  const wasDone = hwStatus(e)==='done';
  e.completedQuestions = parseInt(document.getElementById('hwEditComp_'+id).value)||0;
  const nowDone = hwStatus(e)==='done';
  if(nowDone && !wasDone){
    e.completedDate = todayISO(); // mark exactly which date this homework was actually finished
  } else if(!nowDone){
    e.completedDate = null; // reopened — no longer complete
  }
  hwEditId = null;
  save(); toast(nowDone? 'Marked complete — recorded today 🎉' : 'Updated'); render();
}
function hwDelete(id){
  state.homework = state.homework.filter(x=>x.id!==id);
  save(); toast('Entry deleted'); render();
}
function hwExportCSV(){
  const rows = [['loggedDate','completedDate','subject','topic','questionRange','totalQuestions','completedQuestions','status','notes'],
    ...state.homework.map(e=>[e.date, e.completedDate||'', e.subject, e.topic, e.questionRange, e.totalQuestions, e.completedQuestions, hwStatus(e), (e.notes||'').replace(/,/g,';')])];
  const csv = rows.map(r=>r.join(',')).join('\\n');
  triggerDownload('ca-karo-homework.csv', csv, 'text/csv');
}

function hwDueOrOverdue(){
  const today = todayISO();
  return state.homework.filter(e=> e.dueDate && hwStatus(e)!=='done' && e.dueDate<=today)
    .sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
}
function hwUpcoming(){
  const today = todayISO();
  return state.homework.filter(e=> e.dueDate && hwStatus(e)!=='done' && e.dueDate>today)
    .sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
}
/* Persistent To-Do card on the Today page — the always-visible version of the daily popup,

/* "Add to phone" — generates a standard .ics calendar file for the homework's due date.
   Opening it prompts the phone's Calendar/Reminders app to add an event — works fully
   offline, no account or backend needed. */
function addHWToPhone(id){
  const e = state.homework.find(x=>x.id===id);
  if(!e || !e.dueDate) return;
  const dt = e.dueDate.replace(/-/g,'');
  const ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Ca Karo//Homework Reminder//EN',
    'BEGIN:VEVENT',
    `UID:${e.id}@cakaro`,
    `DTSTART;VALUE=DATE:${dt}`,
    `DTEND;VALUE=DATE:${dt}`,
    `SUMMARY:Homework due: ${(e.topic||'').replace(/\n/g,' ')} (${e.subject})`,
    `DESCRIPTION:${(e.questionRange||'Homework')} — logged in Ca Karo`,
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Homework due today','TRIGGER:-PT9H','END:VALARM',
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
  triggerDownload(`homework-${e.subject}-${e.dueDate}.ics`, ics, 'text/calendar');
}

function checkRevisionPopup(force){
  checkDailyReminders(force);
}
function checkHWPopup(force){
  checkDailyReminders(force);
}
function checkDailyReminders(force){
  if(!state.onboarded) return; // don't fight with the onboarding modal
  const alreadyShownToday = state.lastRevisionPromptDate===todayISO() && state.lastHWPromptDate===todayISO();
  if(!force && alreadyShownToday) return;
  const dueRev = revisionsDue();
  const dueHW = hwDueOrOverdue();
  if(!dueRev.length && !dueHW.length){ if(force){ closeModal(); toast('All caught up 🎉'); } return; }
  state.lastRevisionPromptDate = todayISO();
  state.lastHWPromptDate = todayISO();
  save();

  const groupedRev = {};
  dueRev.forEach(r=>{ (groupedRev[r.subject]=groupedRev[r.subject]||[]).push(r); });

  openModal(`
    <button class="close-x" onclick="closeModal()">✕</button>
    <h2>🔔 Today's reminders</h2>
    <p style="color:var(--sub);">Revisions due (spaced repetition) and homework you haven't finished yet — all in one place.</p>
    <div style="max-height:380px;overflow-y:auto;margin-top:10px;">
    ${dueRev.length? `
      <div class="reminder-section-hd">🔁 REVISIONS DUE</div>
      ${Object.keys(groupedRev).map(subj=>`
        <div style="font-size:11px;font-weight:800;color:${SUBJECTS[subj].color};text-transform:uppercase;letter-spacing:.04em;margin:10px 0 4px;">${SUBJECTS[subj].name}</div>
        ${groupedRev[subj].map(r=>`
          <div class="list-row" style="padding:8px 0;">
            <div style="flex:1;"><b style="font-size:13px;">${r.chapter.name}</b><br><span style="color:var(--sub);font-size:11.5px;">Revision ${r.stage} (day ${state.settings.revisionOffsets[r.stage-1]}) · due ${fmtDate(r.dueDate)}</span></div>
            <button class="btn sm" onclick="completeRevision('${r.subject}','${r.chapter.id}',${r.stage});checkDailyReminders(true);">✓ Done</button>
          </div>`).join('')}
      `).join('')}
    ` : ''}
    ${dueHW.length? `
      <div class="reminder-section-hd">📋 HOMEWORK DUE</div>
      ${dueHW.map(e=>`
        <div class="list-row" style="padding:8px 0;">
          <span class="hw-subj-dot" style="background:${SUBJECTS[e.subject].color}"></span>
          <div style="flex:1;"><b style="font-size:13px;">${e.topic}</b><br><span style="color:${e.dueDate<todayISO()?'#D64545':'var(--sub)'};font-size:11.5px;font-weight:${e.dueDate<todayISO()?'700':'400'};">${e.dueDate<todayISO()?'Overdue since':'Due'} ${fmtDate(e.dueDate)}</span></div>
          <button class="btn sm" onclick="hwMarkDone('${e.id}');checkDailyReminders(true);">✓ Done</button>
        </div>`).join('')}
    ` : ''}
    </div>
    <button class="btn outline" style="width:100%;margin-top:14px;" onclick="closeModal()">Remind me later</button>
  `);
}

/* ---------- FINAL REVISION ---------- */
function pageFinalRev(){
  const dte = daysToExam();
  const passes = state.finalRevPasses;
  const subjOrder = SUBJECT_KEYS;
  const plan = [];
  if(dte!==null){
    const totalUnits = subjOrder.length*passes;
    const daysPerUnit = Math.max(1, Math.floor(dte/totalUnits));
    let cursor = todayISO();
    for(let p=1;p<=passes;p++){
      subjOrder.forEach(k=>{
        const start = cursor;
        cursor = addDays(cursor, daysPerUnit);
        plan.push({pass:p, subject:k, start, end:addDays(cursor,-1)});
      });
    }
  }
  const shortfall = dte!==null ? Math.max(0, (subjOrder.length*passes*2) - dte) : 0;
  return `
  <div class="topbar"><div class="greet"><h1>Final Revision</h1><p>Paper-by-paper plan, counted back from ${state.profile.examDate?fmtDate(state.profile.examDate):'your exam date'}.</p></div>
  <button class="btn ghost" onclick="openFinalRevSettings()">✏️ Edit plan</button></div>
  ${shortfall>0? `<div class="card" style="background:#FFF6DE;border:none;color:#7A5A00;margin-bottom:18px;">This plan needs <b>${shortfall} more days</b> than you have before the exam — cut a pass, or start today.</div>`:''}
  ${dte===null? `<div class="empty"><div class="big">🎯</div><h3>Set your exam date</h3><p>Go to Settings to add your first exam date, then this plan builds itself.</p></div>` :
  plan.map((row,i)=>`
    <div class="card" style="margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div><span class="badge">PASS ${row.pass}</span> <b style="margin-left:8px;">${SUBJECTS[row.subject].name}</b></div>
        <span style="color:var(--sub);font-size:12.5px;">${fmtDate(row.start)} – ${fmtDate(row.end)}</span>

/* ---------- DASHBOARD ---------- */
function weekStats(startOffsetDays){
  const days = [];
  for(let i=startOffsetDays;i<startOffsetDays+7;i++) days.push(addDays(todayISO(),-i));
  const minutes = days.reduce((s,d)=>s+(sessionsByDate()[d]||0),0);
  const chaptersDone = SUBJECT_KEYS.reduce((s,k)=>s+state.chapters[k].filter(c=>c.firstReadDate && days.includes(c.firstReadDate)).length,0);
  const revisionsCleared = SUBJECT_KEYS.reduce((s,k)=>s+state.chapters[k].reduce((rs,c)=>rs+Object.values(c.revStages||{}).filter(v=>v && days.includes(v)).length,0),0);
  return {minutes, chaptersDone, revisionsCleared};
}
/* Auto-detected weak topics: subjects ranked by how many priority-A ("must master") chapters
   are still unread. Same signal used across Dashboard, Weekly Review, and Strategy. */
function weakTopics(keys, limit){
  return keys.map(k=>({
    k, unreadA: state.chapters[k].filter(c=>c.priority==='A' && !c.firstRead).length
  })).filter(w=>w.unreadA>0).sort((a,b)=>b.unreadA-a.unreadA).slice(0,limit||5);
}
function daysStudiedCount(){
  return Object.values(sessionsByDate()).filter(m=>m>0).length;
}
function trendChartSVG(numDays, withAxis){
  const w=680, h=withAxis? 110:90, pad=6;
  const chartH = withAxis? 90:90;
  const pts = [];
  for(let i=numDays-1;i>=0;i--) pts.push(sessionsByDate()[addDays(todayISO(),-i)]||0);
  const max = Math.max(1,...pts);
  const stepX = (w-2*pad)/(pts.length-1);
  const coords = pts.map((v,i)=>{
    const x = pad+i*stepX;
    const y = chartH-pad-(v/max)*(chartH-2*pad);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  const areaPath = `M${pad},${chartH-pad} L${coords.join(' L')} L${w-pad},${chartH-pad} Z`;
  const startLabel = fmtDate(addDays(todayISO(),-(numDays-1)));
  const midLabel = fmtDate(addDays(todayISO(),-Math.floor(numDays/2)));
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${withAxis?90:70}px;display:block;">
    <defs><linearGradient id="trendGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--violet)" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="var(--violet)" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${areaPath}" fill="url(#trendGrad)"/>
    <polyline points="${coords.join(' ')}" fill="none" stroke="var(--violet)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${withAxis? `
    <text x="${pad}" y="${chartH+16}" font-size="10" fill="var(--sub)" text-anchor="start">${startLabel}</text>
    <text x="${w/2}" y="${chartH+16}" font-size="10" fill="var(--sub)" text-anchor="middle">${midLabel}</text>
    <text x="${w-pad}" y="${chartH+16}" font-size="10" fill="var(--sub)" text-anchor="end">Today</text>` : ''}
  </svg>`;
}

    <div class="card" style="background:#FFEDF4;border:none;"><div class="stat-label" style="color:#C0356E">Streak</div><div class="stat-num" style="color:#C0356E">${currentStreak()} days</div></div>
    <div class="card tint-amber"><div class="stat-label">Days to exam</div><div class="stat-num">${daysToExam()===null?'—':daysToExam()}</div></div>

  ${weak.length? `

      <button class="btn sm ghost" onclick="go('syllabus')">Study →</button>
    </div>`).join('')}
  </div>` : ''}

  <div class="section-title">Study trend <span class="hint">last 30 days</span></div>

/* ---------- AI STRATEGY (local, rule-based) ---------- */
let strategyTab = 'pace'; // pace | air
function setStrategyTab(t){ strategyTab=t; render(); }
function pageStrategy(){
  return `
  <div class="topbar"><div class="greet"><h1>Strategy</h1><p>Your pacing plan and the researched topper playbook, in one place.</p></div></div>
  <div class="chiprow" style="margin-bottom:16px;">
    <span class="chip ${strategyTab==='pace'?'active':''}" onclick="setStrategyTab('pace')">🧠 Pace Plan</span>
    <span class="chip ${strategyTab==='air'?'active':''}" onclick="setStrategyTab('air')">⚡ Topper Playbook</span>
  </div>
  ${strategyTab==='pace'? pageStrategyPace() : pageStrategyAir()}
  `;
}
function pageStrategyPace(){
  const dte = daysToExam();
  const groupKeys = activeSubjectKeys();
  const groupTotal = groupKeys.reduce((s,k)=>s+state.chapters[k].length,0);
  const groupDone = groupKeys.reduce((s,k)=>s+state.chapters[k].filter(c=>c.firstRead).length,0);
  const remainingChapters = groupTotal-groupDone;
  const subjStats = activeSubjectKeys().map(k=>{
    const chs = state.chapters[k];
    const conf = subjectPriorityReadiness(k)*5; // scaled to a 0-5 "readiness" figure for display
    const prog = subjectProgress(k);
    return {k, conf, prog, remaining: chs.length - chs.filter(c=>c.firstRead).length};
  });
  const weakest = subjStats.slice().sort((a,b)=>(a.conf+a.prog/100) - (b.conf+b.prog/100)).slice(0,3);
  const avgMinPerChapter = firstReadCount()>0 ? Math.round(state.sessions.filter(s=>s.activity==='reading').reduce((s,x)=>s+(x.durationMin||0),0)/Math.max(1,firstReadCount())) : 90;
  const neededMin = remainingChapters*avgMinPerChapter;
  const neededPerDay = dte && dte>0 ? Math.ceil(neededMin/dte) : null;
  const currentPace = Math.round(last7DaysMinutes()/7);
  const paceGap = neededPerDay!==null ? neededPerDay - currentPace : null;

  const actions = [];
  if(remainingChapters>0){
    const nextWeak = weakest.find(w=>w.remaining>0) || weakest[0];
    actions.push(`Start today with <b>${SUBJECTS[nextWeak.k].name}</b> — it has the lowest coverage + priority-readiness combo (${nextWeak.prog}% done, ${nextWeak.conf.toFixed(1)}/5 readiness).`);
  }
  if(revisionsDue().length>0){
    actions.push(`Clear <b>${revisionsDue().length} revision${revisionsDue().length>1?'s':''}</b> due right now before adding new material — spaced revision is what's decaying fastest.`);
  }
  if(paceGap!==null && paceGap>0){
    actions.push(`Your last-7-day pace is ${minToHM(currentPace)}/day. To finish on time you need roughly <b>${minToHM(neededPerDay)}/day</b> — that's ${minToHM(paceGap)} more than your current average.`);
  } else if(paceGap!==null){
    actions.push(`You're pacing ahead of what's needed (${minToHM(currentPace)}/day vs ${minToHM(neededPerDay)}/day required). Use the slack for revisions and mock tests.`);
  }
  const testsSat = state.tests.filter(t=>t.status==='complete').length;
  if(testsSat < SUBJECT_KEYS.length){
    actions.push(`Only ${testsSat} scored test${testsSat===1?'':'s'} logged so far — schedule at least one chapter test per weak subject to convert reading into exam-ready recall.`);
  }
  if(currentStreak()===0){
    actions.push(`No active streak — a short 20–30 minute session today restarts it and is proven to make the next day easier to start.`);
  }
  if(!actions.length) actions.push("You're in good shape — keep the current pace and prioritise revisions as they come due.");

  return `
  <div class="grid cols-3">
    <div class="card tint-violet"><div class="stat-label">Chapters remaining</div><div class="stat-num">${remainingChapters}</div><div class="stat-sub">of ${totalChapters()}</div></div>
    <div class="card"><div class="stat-label" style="color:var(--sub)">Required pace</div><div class="stat-num">${neededPerDay===null?'—':minToHM(neededPerDay)}<small>/day</small></div><div class="stat-sub" style="color:var(--sub)">vs your ${minToHM(currentPace)}/day now</div></div>
    <div class="card tint-amber"><div class="stat-label">Days left</div><div class="stat-num">${dte===null?'—':dte}</div></div>
  </div>
  <div class="section-title">Weakest subjects right now</div>
  <div class="card">${weakest.map(w=>`
    <div class="subject-row"><div class="sname"><span class="swatch" style="background:${SUBJECTS[w.k].color}"></span>${w.k}</div>
    <div class="progress-track"><div class="progress-fill" style="width:${w.prog}%;background:${SUBJECTS[w.k].color}"></div></div>
    <div class="spct">${w.conf.toFixed(1)}★</div></div>`).join('')}</div>
  <div class="section-title">Next best actions</div>
  ${actions.map((a,i)=>`<div class="strategy-item"><div class="num">${String(i+1).padStart(2,'0')}</div><div>${a}</div></div>`).join('')}
  `;
}

/* ---------- PWA: "Add to Home Screen" support ---------- */
/* Builds a manifest + icon at runtime (no separate files needed for a single-file app) so the
   browser can offer to install Ca Karo like a native app. Full one-tap installability needs the
   file hosted over https (not opened as a local file:// path) — this wiring is ready either way,
   and iOS/Android "Add to Home Screen" via the browser's share sheet works regardless. */
let deferredInstallPrompt = null;
(function setupPWA(){
  try{
    const iconURI = APP_ICON_DATAURI;
    const manifest = {
      name:"Ca Karo — CA Inter Study Tracker", short_name:"Ca Karo",
      start_url:".", display:"standalone", background_color:"#EFEBFF", theme_color:"#6C5CE7",
      icons:[{src:iconURI, sizes:"192x192", type:"image/png", purpose:"any maskable"}]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
    const link = document.createElement('link');
    link.rel = 'manifest'; link.href = URL.createObjectURL(manifestBlob);
    document.head.appendChild(link);
    const appleIcon = document.createElement('link');
    appleIcon.rel = 'apple-touch-icon'; appleIcon.href = iconURI;
    document.head.appendChild(appleIcon);

    if('serviceWorker' in navigator){
      const swCode = `self.addEventListener('fetch', e => {}); self.addEventListener('install', e => self.skipWaiting());`;
      const swBlob = new Blob([swCode], {type:'application/javascript'});
      navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
    }
  }catch(e){ /* installability is a progressive enhancement — never block the app on it */ }
})();
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
});
async function installApp(){
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    render();
    return;
  }
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  openModal(`
    <button class="close-x" onclick="closeModal()">✕</button>
    <h2>📲 Add Ca Karo to your Home Screen</h2>
    ${isIOS? `
      <p style="color:var(--sub);">On iPhone/iPad in Safari:</p>
      <ol style="color:var(--sub);font-size:13.5px;line-height:1.9;padding-left:20px;">
        <li>Tap the <b>Share</b> icon (square with an arrow) in the toolbar</li>
        <li>Scroll down and tap <b>Add to Home Screen</b></li>
        <li>Tap <b>Add</b> — Ca Karo now opens like a regular app</li>
      </ol>
    ` : `
      <p style="color:var(--sub);">Your browser hasn't offered an install prompt yet — this usually needs Ca Karo to be opened from a hosted https:// link rather than a local file. If it was opened that way, look for an <b>Install</b> icon in your browser's address bar, or check the browser menu for <b>"Add to Home Screen"</b> / <b>"Install app"</b>.</p>
    `}
  `);
}

      <div class="pin-dots" id="pinDots">${renderPinDots()}</div>
      <p id="lockError" style="color:#D64545;font-size:12.5px;min-height:16px;">&nbsp;</p>
      <input type="password" inputmode="numeric" id="pinHiddenInput" maxlength="6" autofocus
        style="opacity:0;position:absolute;pointer-events:none;" oninput="onPinInput(this.value)">
      <button class="btn" style="width:100%;margin-top:10px;" onclick="document.getElementById('pinHiddenInput').focus()">Tap to enter code</button>
    </div>`;
  setTimeout(()=>{ const i=document.getElementById('pinHiddenInput'); if(i) i.focus(); }, 50);
}
function renderPinDots(){
  let dots = '';
  for(let i=0;i<6;i++){ dots += `<span class="pin-dot ${i<pinBuffer.length?'filled':''}"></span>`; }
  return dots;
}
function onPinInput(val){
  pinBuffer = val.replace(/\D/g,'').slice(0,6);
  const dotsEl = document.getElementById('pinDots');
  if(dotsEl) dotsEl.innerHTML = renderPinDots();
  if(pinBuffer.length>=4){
    if(simpleHash(pinBuffer)===state.security.pinHash){
      unlocked = true;
      const lockEl = document.getElementById('lockScreen');
      if(lockEl) lockEl.remove();
      document.getElementById('app').style.display = '';
      render(); maybeOnboard(); checkDailyReminders();
    } else if(pinBuffer.length===6){
      document.getElementById('lockError').textContent = 'Incorrect code, try again';
      pinBuffer = '';
      document.getElementById('pinHiddenInput').value = '';
      const dotsEl2 = document.getElementById('pinDots');
      if(dotsEl2) dotsEl2.innerHTML = renderPinDots();
    }
  }
}

restoreActiveSessionOnLoad();
if(needsUnlock()){
  renderLockScreen();
} else {
  render();
  maybeOnboard();
  checkDailyReminders();
}
window.addEventListener('beforeunload', save);
</script>
</body>
</html>
